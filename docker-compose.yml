services:
  api:
    build:
      context: .
      dockerfile: Dockerfile

    ports:
      - "8080:8080"

    volumes:
      # AI model checkpoints are mounted from the local machine.
      # They are not included inside the Docker image.
      - ./ai_models:/app/ai_models:ro

      # Keep uploaded files and generated outputs on the host machine.
      - ./media:/app/media

      # Keep pipeline debug images available on the host machine.
      - ./test_images/debug:/app/test_images/debug

    env_file:
      # Load secrets and Django environment variables at runtime.
      - .env

    environment:
      # Explicitly use the same port as the Dockerfile and Gunicorn.
      PORT: 8080

      # Ensures ApiConfig.ready() loads the models.
      RUN_MAIN: "true"